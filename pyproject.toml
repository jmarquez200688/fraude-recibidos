[project]
name = "fraude-recibos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jmarquez88", email = "jvmp88@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
fraude-recibos = "fraude_recibos:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
